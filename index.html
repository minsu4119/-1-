<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전시회 준비중</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf7f2;
      color: #2f2f2f;
      font-family: "Noto Sans KR", Arial, sans-serif;
      text-align: center;
    }

    .message {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    @media (min-width: 768px) {
      .message {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <div class="message">전시회 준비중</div>
</body>
</html>
